        <path d="M138.54,50.07Q139.22,50.16 140.03,50.26Q140.84,50.36 141.66,50.45Q142.48,50.53 143.20,50.57Q143.93,50.61 144.46,50.61Q147.06,50.61 149.56,50.46Q152.06,50.31 154.90,49.85L154.88,53.23Q153.70,53.40 152.02,53.55Q150.34,53.69 148.40,53.78Q146.45,53.86 144.49,53.86Q143.75,53.86 142.69,53.80Q141.62,53.74 140.53,53.63Q139.44,53.52 138.61,53.42Z"/>
        <path d="M138.39,55.41Q138.95,55.50 139.76,55.60Q140.57,55.70 141.41,55.75Q142.26,55.80 142.99,55.84Q143.73,55.87 144.15,55.87Q146.69,55.87 148.64,55.77Q150.59,55.68 152.19,55.53Q153.80,55.38 155.24,55.21L155.22,58.69Q153.95,58.84 152.76,58.94Q151.57,59.03 150.32,59.09Q149.07,59.16 147.56,59.18Q146.06,59.20 144.10,59.20Q143.46,59.20 142.42,59.17Q141.38,59.13 140.30,59.06Q139.22,58.98 138.44,58.89Z"/>
      </g>

      <!-- 平日5曜日ドット（月〜金） -->
      <g>
        <circle cx="54" cy="92.5" r="2.6" fill="#7A9084"/>
        <circle cx="81" cy="92.5" r="2.6" fill="#7A9084"/>
        <circle cx="108" cy="92.5" r="2.6" fill="#7A9084"/>
        <circle cx="135" cy="92.5" r="2.6" fill="#7A9084"/>
        <circle cx="162" cy="92.5" r="2.6" fill="#7A9084"/>
      </g>

      <!-- 平日カレンダーセル格子（5列×3週・曜日ごとに縦一列で同色＆アンダーバー統一：月=もえる / 火=資源1 / 水=なし / 木=もえる / 金=もえない） -->
      <!-- 1週目 -->
      <rect x="43" y="102" width="22" height="22" rx="5.6" fill="#FADCD0"/>
      <rect x="46" y="115.6" width="16" height="4.4" rx="2.2" fill="#D9480F"/>
      <rect x="70" y="102" width="22" height="22" rx="5.6" fill="#CEF2E5"/>
      <rect x="73" y="115.6" width="16" height="4.4" rx="2.2" fill="#087F5B"/>
      <rect x="97" y="102" width="22" height="22" rx="5.6" fill="#DAE5DE" fill-opacity="0.88"/>
      <rect x="124" y="102" width="22" height="22" rx="5.6" fill="#FADCD0"/>
      <rect x="127" y="115.6" width="16" height="4.4" rx="2.2" fill="#D9480F"/>
      <rect x="151" y="102" width="22" height="22" rx="5.6" fill="#DCE2FA"/>
      <rect x="154" y="115.6" width="16" height="4.4" rx="2.2" fill="#364FC7"/>

      <!-- 2週目 -->
      <rect x="43" y="130" width="22" height="22" rx="5.6" fill="#FADCD0"/>
      <rect x="46" y="143.6" width="16" height="4.4" rx="2.2" fill="#D9480F"/>
      <rect x="70" y="130" width="22" height="22" rx="5.6" fill="#CEF2E5"/>
      <rect x="73" y="143.6" width="16" height="4.4" rx="2.2" fill="#087F5B"/>
      <rect x="97" y="130" width="22" height="22" rx="5.6" fill="#DAE5DE" fill-opacity="0.88"/>
      <rect x="124" y="130" width="22" height="22" rx="5.6" fill="#FADCD0"/>
      <rect x="127" y="143.6" width="16" height="4.4" rx="2.2" fill="#D9480F"/>
      <rect x="151" y="130" width="22" height="22" rx="5.6" fill="#DCE2FA"/>
      <rect x="154" y="143.6" width="16" height="4.4" rx="2.2" fill="#364FC7"/>

      <!-- 3週目 -->
      <rect x="43" y="158" width="22" height="22" rx="5.6" fill="#FADCD0"/>
      <rect x="46" y="171.6" width="16" height="4.4" rx="2.2" fill="#D9480F"/>
      <rect x="70" y="158" width="22" height="22" rx="5.6" fill="#CEF2E5"/>
      <rect x="73" y="171.6" width="16" height="4.4" rx="2.2" fill="#087F5B"/>
      <rect x="97" y="158" width="22" height="22" rx="5.6" fill="#DAE5DE" fill-opacity="0.88"/>
      <rect x="124" y="158" width="22" height="22" rx="5.6" fill="#FADCD0"/>
      <rect x="127" y="171.6" width="16" height="4.4" rx="2.2" fill="#D9480F"/>
      <rect x="151" y="158" width="22" height="22" rx="5.6" fill="#DCE2FA"/>
      <rect x="154" y="171.6" width="16" height="4.4" rx="2.2" fill="#364FC7"/>

      <!-- ガラス表面の斜めグレア -->
      <rect x="30" y="34" width="156" height="162" fill="url(#lg-sheen)"/>
    </g>

    <!-- プリズム色収差インナーエッジ & 対角スペキュラアウターリム -->
    <rect x="31" y="35" width="154" height="160" rx="29" fill="none" stroke="url(#lg-prism-edge)" stroke-width="1.5"/>
    <rect x="30" y="34" width="156" height="162" rx="30" fill="none" stroke="url(#lg-rim-spec)" stroke-width="2"/>
  </g>

  <!-- 4. 右下クリアプリズムガラス球 + 純白ゴミ袋（緑系持ち手・108%拡大版 Final-3） -->
  <g filter="url(#badge-drop)">
    <circle cx="172" cy="166" r="46" fill="url(#orb-grad)"/>

    <!-- ガラス球越しに屈折して透けるカレンダー角と反射ハイライト -->
    <g clip-path="url(#orb-clip)">
      <rect x="114" y="114" width="76" height="86" rx="24" fill="#FFFFFF" opacity="0.18"/>
      <ellipse cx="153" cy="136" rx="27" ry="12" fill="#FFFFFF" opacity="0.34" transform="rotate(-28 153 136)"/>
      <ellipse cx="191" cy="196" rx="26" ry="10" fill="#72EFDD" opacity="0.32" transform="rotate(-25 191 196)"/>
    </g>

    <circle cx="172" cy="166" r="44.5" fill="none" stroke="url(#lg-prism-edge)" stroke-width="2"/>
    <circle cx="172" cy="166" r="46" fill="none" stroke="url(#lg-rim-spec)" stroke-width="2.2"/>

    <!-- 純白ゴミ袋 + ミントグリーン右耳 & エメラルド結束リング -->
    <g filter="url(#bag-inner-drop)" transform="translate(172, 167) scale(1.08) translate(-174, -168)">
      <path d="M174,142 C166.5,135 158.5,134 155.5,138.5 C157.5,142.5 165,145.5 174,146.5 Z" fill="#FFFFFF"/>
      <path d="M174,142 C181.5,135 189.5,134 192.5,138.5 C190.5,142.5 183,145.5 174,146.5 Z" fill="#B2F2BB"/>
      <path d="M163.5,147.5 C152,151.5 145,161 143,173.5 C141.5,182.5 144.5,190.5 152.5,193.5 C161,196 187,196 195.5,193.5 C203.5,190.5 206.5,182.5 205,173.5 C203,161 196,151.5 184.5,147.5 Z" fill="#FFFFFF"/>
      <path d="M159,159 C155.5,166.5 156,176 159.5,182" fill="none" stroke="#9EE6C4" stroke-width="2.8" stroke-linecap="round" opacity="0.82"/>
      <rect x="166.5" y="142.8" width="15" height="7.4" rx="3.7" fill="#12B886"/>
    </g>
  </g>
</svg>
