<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#2E8B5B"/>
      <stop offset="50%" stop-color="#1E6444"/>
      <stop offset="100%" stop-color="#113C2A"/>
    </linearGradient>

    <!-- フロストガラス・カレンダーカード塗り -->
    <linearGradient id="card-glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#F6FBF8" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#E4F4EC" stop-opacity="0.74"/>
    </linearGradient>

    <!-- エメラルドガラス・ヘッダー帯塗り -->
    <linearGradient id="hdr-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#288253" stop-opacity="0.97"/>
      <stop offset="55%" stop-color="#1D6841" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#155234" stop-opacity="0.98"/>
    </linearGradient>

    <!-- 対角スペキュラ・ガラスリム -->
    <linearGradient id="lg-rim-spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#B8FFE0" stop-opacity="0.38"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="78%" stop-color="#9BE8FF" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.90"/>
    </linearGradient>

    <!-- プリズム色収差インナーエッジ -->
    <linearGradient id="lg-prism-edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#66E3FF" stop-opacity="0.58"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="75%" stop-color="#A3F7BF" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#FFD8E8" stop-opacity="0.55"/>
    </linearGradient>

    <!-- ガラス表面の斜めグレア -->
    <linearGradient id="lg-sheen" x1="0.12" y1="0" x2="0.62" y2="0.82">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="36%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- 右下クリアプリズムガラス球 -->
    <radialGradient id="orb-grad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="42%" stop-color="#3BB27B" stop-opacity="0.68"/>
      <stop offset="85%" stop-color="#144F35" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#5CE6A0" stop-opacity="0.82"/>
    </radialGradient>

    <!-- 光学フィルタ（SVG 1.1 互換のブラー＆シャドウ） -->
    <filter id="soft-blur-lg" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="soft-blur-sm" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="glass-drop" x="-20%" y="-15%" width="140%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badge-drop" x="-28%" y="-22%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bag-inner-drop" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.24"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="card-clip">
      <rect x="30" y="34" width="156" height="162" rx="30"/>
    </clipPath>

    <clipPath id="orb-clip">
      <circle cx="172" cy="166" r="46"/>
    </clipPath>
  </defs>

  <!-- 1. フルブリード背景 + コースティクス（光の揺らぎ） -->
  <rect width="240" height="240" fill="url(#bg-grad)"/>
  <g filter="url(#soft-blur-lg)">
    <ellipse cx="56" cy="42" rx="76" ry="52" fill="#74F2B3" opacity="0.36" transform="rotate(-18 56 42)"/>
    <ellipse cx="198" cy="96" rx="68" ry="44" fill="#56CFE1" opacity="0.30" transform="rotate(25 198 96)"/>
    <ellipse cx="85" cy="206" rx="75" ry="40" fill="#A9F59E" opacity="0.22"/>
  </g>

  <!-- 2. 背面に傾いたセカンド・ガラスシート -->
  <g transform="rotate(-5.5 110 115)">
    <rect x="38" y="38" width="148" height="156" rx="29" fill="#FFFFFF" fill-opacity="0.16" stroke="url(#lg-rim-spec)" stroke-width="1.6"/>
  </g>

  <!-- 3. メインのフロストガラス月間カレンダー -->
  <g filter="url(#glass-drop)">
    <rect x="30" y="34" width="156" height="162" rx="30" fill="url(#card-glass)"/>

    <g clip-path="url(#card-clip)">
      <!-- カード内部に屈折して透ける光 -->
      <circle cx="168" cy="112" r="56" fill="#72EFDD" opacity="0.18" filter="url(#soft-blur-sm)"/>
      <circle cx="52" cy="176" r="48" fill="#FFE3B3" opacity="0.22" filter="url(#soft-blur-sm)"/>

      <!-- エメラルドガラス・ヘッダー帯 -->
      <rect x="30" y="34" width="156" height="48" fill="url(#hdr-glass)"/>
      <path d="M30,52 Q95,34 186,60 L186,34 L30,34 Z" fill="#80FFBF" opacity="0.16"/>
      <line x1="30" y1="82" x2="186" y2="82" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2"/>

      <!-- カレンダーリング穴 -->
      <circle cx="47" cy="48" r="3.8" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1"/>
      <circle cx="169" cy="48" r="3.8" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1"/>

      <!-- 「さいたま」ロゴ（同梱 Noto Sans JP Variable wght=900 のアウトラインパス） -->
