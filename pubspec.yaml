name: saitama_gomi
description: "さいたま市のごみ収集日と分別区分を確認するアプリ。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Material のウィジェットを日本語表示にするため。
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 状態管理。TenpAI と揃えて Riverpod を使う。
  flutter_riverpod: ^3.3.2
  # 選択した地区の永続化。保存するのは地区IDだけなので軽量なKVSで足りる。
  shared_preferences: ^2.5.3
  # 収集日前夜のローカル通知。端末内で完結し、サーバーとは通信しない。
  flutter_local_notifications: ^22.2.0
  # 上記が日時指定の予約に要求する、タイムゾーン付きの日時（TZDateTime）のため。
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
