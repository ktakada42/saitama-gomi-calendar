# gwx（git worktreeの作成・移動）でworktreeを作ったときに走らせるもの。
#
# worktreeの置き場所（base_dir）はここに書かない。各自の好みなので
# ~/.config/gwx/config.toml 側に置く。両者はキー単位で合成され、
# フックは両方走る。
version = "1"

# コミット前チェック（dart format / flutter analyze / flutter test）を
# 有効にする。.githooks/pre-commit はリポジトリに入っているが、Gitは
# core.hooksPath を向けないと見に行かない。設定を忘れるとフォーマット漏れや
# テスト崩れに気づかずpushすることになる。
#
# git config の書き込み先はworktreeごとではなく共有の設定ファイルなので、
# 二度目以降は同じ値を書くだけ。
[[hooks.post_create]]
type = "command"
command = "git config core.hooksPath .githooks"

# 依存を解決しておく。.dart_tool/ はworktreeごとに要る。
#
# これが無いと dart format が flutter_lints を解決できず、触っていない
# ファイルまで「変更あり」と報告する。pre-commitフックを有効にした直後の
# 1回目のコミットが、必ずその誤検知で止まることになる。
[[hooks.post_create]]
type = "command"
command = "flutter pub get"

# ここから server/（Cloudflare Workers の中継サーバー）の分。
#
# ローカル開発用の秘匿値。.gitignore 対象なので、worktree を作っただけでは
# 存在せず、無いまま `npm run dev` すると起動時に落ちる。
#
# copy フックではなくコマンドにしているのは、copy は元ファイルが無いと
# 「飛ばす」ではなく「失敗」になるため。クローンしただけの人には main 側にも
# 無いので、その場合は飛ばして進む。
[[hooks.post_create]]
type = "command"
command = 'src="$GWX_MAIN_WORKTREE/server/.dev.vars"; if [ -f "$src" ]; then cp "$src" server/.dev.vars; else echo "gwx: server/.dev.vars が main に無いので飛ばした（server/README.md 参照）"; fi'

# server の依存を解決する。node_modules/ はworktreeごとに要る。
#
# `npm install` ではなく `npm ci` なのは、lockfile のとおりに入れたいのと、
# worktree ごとにブランチが違う（＝依存も違いうる）ため。
[[hooks.post_create]]
type = "command"
command = "npm ci"
work_dir = "server"
