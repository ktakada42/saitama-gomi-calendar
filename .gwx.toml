# gwx（git worktreeの作成・移動）のリポジトリ設定。
# 各自の好みではなくこのリポジトリの都合なので、コミットして共有する。
# 個人の設定は同じ書式で ~/.config/gwx/config.toml に置く。
version = "1"

[defaults]
# worktreeを作る場所。gwxはこれを「メインworktreeからの相対」で解決する。
# このリポジトリはメインworktree自体が worktrees/main に居るので、
# 既定値の "../worktrees" だと worktrees/worktrees/ に潜ってしまう。
base_dir = ".."

# コミット前チェック（dart format / flutter analyze / flutter test）を、
# worktreeを作った時点で有効にする。
#
# .githooks/pre-commit はリポジトリに入っているが、Gitは core.hooksPath を
# 向けないと見に行かない。設定を忘れると、フォーマット漏れやテスト崩れに
# pushしてCIが落ちてから気づくことになる（実際に一度やった）。
#
# git config の書き込み先は worktree ごとではなく共有の設定ファイルなので、
# 一度走れば以降の worktree にも効く。二度目以降は同じ値を書くだけ。
[[hooks.post_create]]
type = "command"
command = "git config core.hooksPath .githooks"

# 依存を解決しておく。.dart_tool/ はworktreeごとに要る。
#
# これが無いと dart format が flutter_lints を解決できず、触っていない
# ファイルまで「変更あり」と報告する（13件出た）。pre-commitフックを
# 有効にした直後の1回目のコミットが、必ずその誤検知で止まることになる。
[[hooks.post_create]]
type = "command"
command = "flutter pub get"
